services:
  db:
    image: postgres:16-alpine
    container_name: warung-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER wajib di-set di .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib di-set di .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB wajib di-set di .env}
      TZ: Asia/Jakarta
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER wajib di-set di .env} -d ${POSTGRES_DB:?POSTGRES_DB wajib di-set di .env}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: warung-api-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER wajib di-set di .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib di-set di .env}@db:5432/${POSTGRES_DB:?POSTGRES_DB wajib di-set di .env}?schema=public"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib di-set di .env}
      PORT: 5000
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN wajib di-set di .env}
      TZ: Asia/Jakarta
    ports:
      - "5000:5000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined into the client bundle at build time
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    container_name: warung-web-prod
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TZ: Asia/Jakarta
    ports:
      - "3000:3000"

volumes:
  postgres_prod_data:
